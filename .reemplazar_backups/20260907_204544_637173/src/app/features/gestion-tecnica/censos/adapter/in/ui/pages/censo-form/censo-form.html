<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()"><div class="modal-box admin-modal-box"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:addIcon"/></span><div><p>Censos</p><h2>{{current()?'Editar censo':'Registrar censo'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()"><div class="admin-field admin-field-span-2"><label>Cultivo</label><select class="admin-select" formControlName="parcelaCultivoId">@for(c of crops();track c.value){<option [value]="c.value">{{c.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label>Fecha del censo</label><input type="date" class="admin-input" formControlName="fechaCenso"/></div><div class="admin-field"><label>Plantas totales</label><input type="number" min="0" class="admin-input" formControlName="plantasTotales"/></div><div class="admin-field"><label>Productivas</label><input type="number" min="0" class="admin-input" formControlName="plantasProductivas"/></div><div class="admin-field"><label>No productivas</label><input type="number" min="0" class="admin-input" formControlName="plantasNoProductivas"/></div><div class="admin-field"><label>Nuevas</label><input type="number" min="0" class="admin-input" formControlName="plantasNuevas"/></div><div class="admin-field"><label>Muertas</label><input type="number" min="0" class="admin-input" formControlName="plantasMuertas"/></div><div class="admin-field"><label>Afectadas</label><input type="number" min="0" class="admin-input" formControlName="plantasAfectadas"/></div><div class="admin-field admin-field-span-2"><label>Observación</label><textarea rows="3" class="admin-textarea" formControlName="observacion" maxlength="500"></textarea></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
