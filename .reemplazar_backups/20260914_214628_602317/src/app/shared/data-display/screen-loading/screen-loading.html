@if (loadingService.state().visible) {
  <div
    class="fixed inset-0 z-[140] flex items-center justify-center bg-slate-950/45 p-4"
    role="status"
    aria-live="assertive"
    aria-busy="true"
  >
    <section class="w-full max-w-sm rounded-3xl border border-slate-200 bg-white p-7 text-center shadow-2xl shadow-slate-950/20">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">
        <fa-icon class="text-2xl animate-spin" [icon]="spinnerIcon" />
      </div>

      <h2 class="mt-5 text-lg font-bold text-slate-950">
        {{ loadingService.state().title }}
      </h2>

      @if (loadingService.state().message) {
        <p class="mt-2 text-sm leading-6 text-slate-600">
          {{ loadingService.state().message }}
        </p>
      }

      <div class="mt-6 flex items-center justify-center gap-2 text-xs font-medium text-blue-700">
        <fa-icon [icon]="shieldIcon" />
        <span>No cierres esta ventana mientras finaliza el proceso.</span>
      </div>
    </section>
  </div>
}
