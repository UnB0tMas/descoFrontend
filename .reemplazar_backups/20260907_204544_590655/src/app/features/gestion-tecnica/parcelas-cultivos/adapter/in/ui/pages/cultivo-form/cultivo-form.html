<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()"><div class="modal-box admin-modal-box admin-modal-box--compact"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:addIcon"/></span><div><p>Cultivos</p><h2>{{current()?'Editar cultivo':'Registrar cultivo'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()"><div class="admin-field admin-field-span-2"><label>Variedad</label><select class="admin-select" formControlName="variedadPaltaId" [disabled]="referencesLoading()">@if(referencesLoading()){<option [value]="0">Cargando...</option>}@for(v of varieties();track v.value){<option [value]="v.value">{{v.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label>Fecha de inicio</label><input type="date" class="admin-input" formControlName="fechaInicio"/></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()||referencesLoading()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
