<div
  class="flex w-full items-center justify-center rounded-2xl border border-slate-200 bg-white"
  [class.p-4]="compact"
  [class.p-10]="!compact"
>
  <div class="flex items-center gap-4">
    <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">
      <fa-icon class="animate-spin" [icon]="loadingIcon" />
    </div>

    <div>
      <p class="text-sm font-semibold text-slate-950">{{ title }}</p>
      <p class="mt-1 text-sm text-slate-500">{{ message }}</p>
    </div>
  </div>
</div>
