<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()"><div class="modal-box admin-modal-box"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:pageIcon"/></span><div><p>Parcelas</p><h2>{{current()?'Editar parcela':'Registrar parcela'}}</h2></div></div><button class="admin-icon-button" type="button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()"><div class="admin-field admin-field-span-2"><label>Predio</label><select class="admin-select" formControlName="predioId">@for(p of options();track p.id){<option [value]="p.id">{{p.codigo}} · {{p.label}}</option>}</select></div><div class="admin-field"><label>Código</label><input class="admin-input" formControlName="codigo" maxlength="40"/><app-form-error [control]="form.controls.codigo" fieldLabel="El código"/></div><div class="admin-field"><label>Nombre</label><input class="admin-input" formControlName="nombre" maxlength="150"/><app-form-error [control]="form.controls.nombre" fieldLabel="El nombre"/></div><div class="admin-field admin-field-span-2"><label>Área (ha)</label><input type="number" step="0.0001" min="0" class="admin-input" formControlName="areaHa"/></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button class="admin-primary-button" type="submit" [disabled]="saving()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
