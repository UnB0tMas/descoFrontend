<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()"><div class="modal-box admin-modal-box admin-modal-box--wide"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:pageIcon"/></span><div><p>Salidas de campo</p><h2>{{current()?'Editar salida':'Programar salida'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()"><div class="admin-field"><label>Motivo</label><select class="admin-select" formControlName="motivoSalidaId" [disabled]="refsLoading()"><option [value]="0">Seleccionar</option>@for(m of motives();track m.value){<option [value]="m.value">{{m.label}}</option>}</select></div><div class="admin-field"><label>Fecha y hora programada</label><input type="datetime-local" class="admin-input" formControlName="fechaHoraProgramada"/></div><div class="admin-field admin-field-span-2"><label>Descripción</label><textarea class="admin-textarea" rows="3" maxlength="400" formControlName="descripcion"></textarea></div><div class="admin-field admin-field-span-2"><label>Participantes</label><div class="participant-editor"><select class="admin-select" formControlName="empleadoId"><option [value]="0">Seleccionar empleado</option>@for(e of employees();track e.value){<option [value]="e.value">{{e.label}}</option>}</select><input class="admin-input" formControlName="funcion" maxlength="120" placeholder="Función"/><label class="admin-switch-row"><div><strong>Responsable</strong><span>Responsable principal de la salida.</span></div><input type="checkbox" class="admin-switch-control" formControlName="esResponsable"/></label><button type="button" class="admin-secondary-button" [disabled]="refsLoading()" (click)="addParticipant()">@if(refsLoading()){<span class="loading loading-spinner loading-xs"></span>}@else{<fa-icon [icon]="addIcon"/>} Agregar</button></div><div class="participant-list">@for(p of participants();track p.empleadoId;let i=$index){<article><div><strong>{{p.label}}</strong><span>{{p.funcion||'Participante'}} @if(p.esResponsable){· Responsable}</span></div><button type="button" class="admin-icon-button admin-icon-button--danger" (click)="removeParticipant(i)"><fa-icon [icon]="deleteIcon"/></button></article>}@empty{<p>Agrega al menos un participante.</p>}</div></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()||refsLoading()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
