<dialog #dialog class="modal"><div class="modal-box max-w-3xl bg-white"><header class="admin-modal-header"><div class="admin-modal-heading"><span class="admin-modal-icon"><fa-icon [icon]="pageIcon"/></span><div><h3>Registrar incidencia</h3><p>Completa los datos requeridos.</p></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error" role="alert">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="submit()"><div class="admin-field"><label>Operativo</label><input class="admin-input" type="number" min="1" formControlName="operativoVentaId"/><app-form-error [control]="form.controls.operativoVentaId" fieldLabel="El operativo"/></div><div class="admin-field"><label>Entrega relacionada</label><input class="admin-input" type="number" min="0" formControlName="entregaSocioId"/></div><div class="admin-field"><label>Tipo</label><input class="admin-input" maxlength="25" formControlName="tipoIncidencia"/><app-form-error [control]="form.controls.tipoIncidencia" fieldLabel="El tipo"/></div><div class="admin-field"><label>Severidad</label><select class="admin-select" formControlName="severidad"><option value="">Seleccionar</option><option value="BAJA">Baja</option><option value="MEDIA">Media</option><option value="ALTA">Alta</option><option value="CRITICA">Crítica</option></select><app-form-error [control]="form.controls.severidad" fieldLabel="La severidad"/></div><div class="admin-field"><label>Peso afectado (kg)</label><input class="admin-input" type="number" min="0" step=".01" formControlName="pesoAfectadoKg"/></div><div class="admin-field admin-field-span-2"><label>Descripción</label><textarea class="admin-textarea" rows="4" maxlength="500" formControlName="descripcion"></textarea><app-form-error [control]="form.controls.descripcion" fieldLabel="La descripción"/></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando…}@else{<fa-icon [icon]="saveIcon"/> Registrar}</button></footer></form></div></dialog>
