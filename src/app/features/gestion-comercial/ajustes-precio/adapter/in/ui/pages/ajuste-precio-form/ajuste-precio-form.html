<dialog #dialog class="modal"><div class="modal-box max-w-4xl bg-white"><header class="admin-modal-header"><div class="admin-modal-heading"><span class="admin-modal-icon"><fa-icon [icon]="pageIcon"/></span><div><h3>Registrar ajuste de precio</h3><p>Completa los datos requeridos.</p></div></div><button class="admin-icon-button" type="button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="submit()"><div class="admin-field"><label>Participación</label><input class="admin-input" type="number" min="1" formControlName="participacionId"/></div><div class="admin-field"><label>Operativo</label><input class="admin-input" type="number" min="0" formControlName="operativoVentaId"/></div><div class="admin-field"><label>Condición comercial</label><input class="admin-input" type="number" min="0" formControlName="condicionComercialId"/></div><div class="admin-field"><label>Tipo</label><input class="admin-input" formControlName="tipoAjuste"/></div><div class="admin-field"><label>Precio original</label><input class="admin-input" type="number" min="0" step=".01" formControlName="precioOriginal"/></div><div class="admin-field"><label>Precio aplicado</label><input class="admin-input" type="number" min="0" step=".01" formControlName="precioAplicado"/></div><div class="admin-field"><label>Monto del ajuste</label><input class="admin-input" type="number" step=".01" formControlName="montoAjuste"/></div><div class="admin-field"><label>Porcentaje</label><input class="admin-input" type="number" min="0" max="100" step=".01" formControlName="porcentajeAjuste"/></div><div class="admin-field admin-field-span-2"><label>Motivo</label><textarea class="admin-textarea" rows="3" formControlName="motivo"></textarea></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando…}@else{<fa-icon [icon]="saveIcon"/> Registrar}</button></footer></form></div></dialog>
