<div class="resource-image" [class]="'resource-image resource-image--' + variant">
  @if (src() && !failed()) {
    <img [src]="src()" [alt]="alt" loading="lazy" (error)="onImageError()" />
  } @else {
    <div class="resource-image-placeholder" role="img" [attr.aria-label]="'Sin imagen disponible para ' + alt">
      <svg viewBox="0 0 160 120" aria-hidden="true" focusable="false">
        <rect x="12" y="12" width="136" height="96" rx="14" fill="currentColor" opacity=".08" />
        <path d="M42 82l24-27 18 19 13-14 23 22H42z" fill="currentColor" opacity=".34" />
        <circle cx="55" cy="43" r="9" fill="currentColor" opacity=".34" />
        <path d="M35 95h90" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".2" />
      </svg>
      <span>{{ loading() ? 'Cargando imagen…' : 'Sin imagen' }}</span>
    </div>
  }
</div>
