<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()" aria-labelledby="gt-censo-form-censo-form-dialog-title-1"><div class="modal-box admin-modal-box"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:addIcon"/></span><div><p>Censos</p><h2 id="gt-censo-form-censo-form-dialog-title-1">{{current()?'Editar censo':'Registrar censo'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()" aria-label="Cerrar"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()"><div class="admin-field admin-field-span-2"><label for="gt-censo-form-censo-form-field-1">Cultivo</label><select class="admin-select" formControlName="parcelaCultivoId" id="gt-censo-form-censo-form-field-1">@for(c of crops();track c.value){<option [value]="c.value">{{c.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label for="gt-censo-form-censo-form-field-2">Fecha del censo</label><input type="date" class="admin-input" formControlName="fechaCenso" [max]="today" id="gt-censo-form-censo-form-field-2" /></div><div class="admin-field"><label for="gt-censo-form-censo-form-field-3">Plantas totales</label><input type="number" class="admin-input" formControlName="plantasTotales" min="0"  max="2147483647"  step="1" id="gt-censo-form-censo-form-field-3" /></div><div class="admin-field"><label for="gt-censo-form-censo-form-field-4">Productivas</label><input type="number" class="admin-input" formControlName="plantasProductivas" min="0"  max="2147483647"  step="1" id="gt-censo-form-censo-form-field-4" /></div><div class="admin-field"><label for="gt-censo-form-censo-form-field-5">No productivas</label><input type="number" class="admin-input" formControlName="plantasNoProductivas" min="0"  max="2147483647"  step="1" id="gt-censo-form-censo-form-field-5" /></div><div class="admin-field"><label for="gt-censo-form-censo-form-field-6">Nuevas</label><input type="number" class="admin-input" formControlName="plantasNuevas" min="0"  max="2147483647"  step="1" id="gt-censo-form-censo-form-field-6" /></div><div class="admin-field"><label for="gt-censo-form-censo-form-field-7">Muertas</label><input type="number" class="admin-input" formControlName="plantasMuertas" min="0"  max="2147483647"  step="1" id="gt-censo-form-censo-form-field-7" /></div><div class="admin-field"><label for="gt-censo-form-censo-form-field-8">Afectadas</label><input type="number" class="admin-input" formControlName="plantasAfectadas" min="0"  max="2147483647"  step="1" id="gt-censo-form-censo-form-field-8" /></div><div class="admin-field admin-field-span-2"><label for="gt-censo-form-censo-form-field-9">Observación</label><textarea rows="3" class="admin-textarea" formControlName="observacion" maxlength="300" id="gt-censo-form-censo-form-field-9"></textarea></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
