<section class="ownership-panel"><header><div><p>Titularidad</p><h3>Socios vinculados</h3></div><span>{{titulares.length}}</span></header><div class="ownership-grid">@for(t of titulares;track t.predioTitularidadId){<article><div class="ownership-icon"><fa-icon [icon]="icon"/></div><div class="min-w-0 flex-1"><strong>{{fullName(t)}}</strong><small>{{t.numeroDocumento}} · {{t.tipoTitularidad}}</small></div><b>{{t.porcentaje | number:'1.0-2'}}%</b></article>}@empty{<p class="ownership-empty">No hay titulares registrados.</p>}</div></section>
