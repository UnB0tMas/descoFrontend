<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()"><div class="modal-box admin-modal-box"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:pageIcon"/></span><div><p>Sanidad vegetal</p><h2>{{current()?'Editar caso':'Registrar caso'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()">@if(!current()){<div class="admin-field admin-field-span-2"><label>Cultivo</label><select class="admin-select" formControlName="parcelaCultivoId" [disabled]="refsLoading()">@for(c of crops();track c.value){<option [value]="c.value">{{c.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label>Visita de detección</label><select class="admin-select" formControlName="visitaDeteccionId" [disabled]="refsLoading()">@for(v of visits();track v.value){<option [value]="v.value">{{v.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label>Fecha de detección</label><input type="datetime-local" class="admin-input" formControlName="fechaDeteccion" [max]="maximumDateTime"/></div>}<div class="admin-field admin-field-span-2"><label>Problema fitosanitario</label><select class="admin-select" formControlName="tipoProblemaId" [disabled]="refsLoading()">@for(p of problems();track p.value){<option [value]="p.value">{{p.label}}</option>}</select></div><div class="admin-field"><label>Severidad</label><select class="admin-select" formControlName="severidad">@for(s of severities;track s){<option [value]="s">{{s}}</option>}</select></div><div class="admin-field"><label>Plantas afectadas</label><input type="number" min="0" class="admin-input" formControlName="plantasAfectadas" step="1"  max="2147483647" /></div><label class="admin-switch-row admin-field-span-2"><div><strong>Cantidad estimada</strong><span>Indica si el número de plantas afectadas es aproximado.</span></div><input type="checkbox" class="admin-switch-control" formControlName="cantidadEstimada"/></label><div class="admin-field admin-field-span-2"><label>Observación</label><textarea class="admin-textarea" rows="3" maxlength="500" formControlName="observacion"></textarea></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()||refsLoading()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
