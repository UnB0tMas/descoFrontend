<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()" aria-labelledby="gt-caso-sanitario-form-caso-sanitario-form-dialog-title-1"><div class="modal-box admin-modal-box"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:pageIcon"/></span><div><p>Sanidad vegetal</p><h2 id="gt-caso-sanitario-form-caso-sanitario-form-dialog-title-1">{{current()?'Editar caso':'Registrar caso'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()" aria-label="Cerrar"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()">@if(!current()){<div class="admin-field admin-field-span-2"><label for="gt-caso-sanitario-form-caso-sanitario-form-field-1">Cultivo</label><select class="admin-select" formControlName="parcelaCultivoId" [disabled]="refsLoading()" id="gt-caso-sanitario-form-caso-sanitario-form-field-1">@for(c of crops();track c.value){<option [value]="c.value">{{c.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label for="gt-caso-sanitario-form-caso-sanitario-form-field-2">Visita de detección</label><select class="admin-select" formControlName="visitaDeteccionId" [disabled]="refsLoading()" id="gt-caso-sanitario-form-caso-sanitario-form-field-2">@for(v of visits();track v.value){<option [value]="v.value">{{v.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label for="gt-caso-sanitario-form-caso-sanitario-form-field-3">Fecha de detección</label><input type="datetime-local" class="admin-input" formControlName="fechaDeteccion" [max]="maximumDateTime" id="gt-caso-sanitario-form-caso-sanitario-form-field-3" /></div>}<div class="admin-field admin-field-span-2"><label for="gt-caso-sanitario-form-caso-sanitario-form-field-4">Problema fitosanitario</label><select class="admin-select" formControlName="tipoProblemaId" [disabled]="refsLoading()" id="gt-caso-sanitario-form-caso-sanitario-form-field-4">@for(p of problems();track p.value){<option [value]="p.value">{{p.label}}</option>}</select></div><div class="admin-field"><label for="gt-caso-sanitario-form-caso-sanitario-form-field-5">Severidad</label><select class="admin-select" formControlName="severidad" id="gt-caso-sanitario-form-caso-sanitario-form-field-5">@for(s of severities;track s){<option [value]="s">{{s}}</option>}</select></div><div class="admin-field"><label for="gt-caso-sanitario-form-caso-sanitario-form-field-6">Plantas afectadas</label><input type="number" min="0" class="admin-input" formControlName="plantasAfectadas" step="1"  max="2147483647" id="gt-caso-sanitario-form-caso-sanitario-form-field-6" /></div><label class="admin-switch-row admin-field-span-2"><div><strong>Cantidad estimada</strong><span>Indica si el número de plantas afectadas es aproximado.</span></div><input type="checkbox" class="admin-switch-control" formControlName="cantidadEstimada"/></label><div class="admin-field admin-field-span-2"><label for="gt-caso-sanitario-form-caso-sanitario-form-field-7">Observación</label><textarea class="admin-textarea" rows="3" maxlength="500" formControlName="observacion" id="gt-caso-sanitario-form-caso-sanitario-form-field-7"></textarea></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()||refsLoading()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
