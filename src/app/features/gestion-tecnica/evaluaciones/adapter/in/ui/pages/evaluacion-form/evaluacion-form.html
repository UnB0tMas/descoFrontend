<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()"><div class="modal-box admin-modal-box"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:pageIcon"/></span><div><p>Evaluaciones</p><h2>{{current()?'Editar evaluación':'Registrar evaluación'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()">@if(!current()){<div class="admin-field admin-field-span-2"><label>Visita técnica</label><select class="admin-select" formControlName="visitaTecnicaId" [disabled]="refsLoading()"><option [value]="0">Seleccionar</option>@for(v of visits();track v.value){<option [value]="v.value">{{v.label}}</option>}</select></div>}<div class="admin-field"><label>Tipo de evaluación</label><select class="admin-select" formControlName="tipoEvaluacionId" [disabled]="refsLoading()"><option [value]="0">Seleccionar</option>@for(t of types();track t.value){<option [value]="t.value">{{t.label}}</option>}</select></div><div class="admin-field"><label>Cultivo</label><select class="admin-select" formControlName="parcelaCultivoId"><option [value]="0">Sin cultivo específico</option>@for(c of crops();track c.value){<option [value]="c.value">{{c.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label>Fecha y hora</label><input type="datetime-local" class="admin-input" formControlName="fechaHora" [max]="maximumDateTime" /></div><div class="admin-field admin-field-span-2"><label>Resultado</label><textarea class="admin-textarea" rows="4" formControlName="resultado" maxlength="600"></textarea></div><div class="admin-field admin-field-span-2"><label>Observación</label><textarea class="admin-textarea" rows="3" formControlName="observacion" maxlength="400"></textarea></div><label class="admin-switch-row admin-field-span-2"><div><strong>Registrar materia seca</strong><span>Incluye el porcentaje y número de muestras en esta evaluación.</span></div><input type="checkbox" class="admin-switch-control" formControlName="registrarMateriaSeca"/></label>@if(form.controls.registrarMateriaSeca.value){<div class="admin-field"><label>Materia seca (%)</label><input type="number" min="0" max="100" class="admin-input" formControlName="porcentajeMateriaSeca" step="0.01" /></div><div class="admin-field"><label>Número de muestras</label><input type="number" min="1" class="admin-input" formControlName="numeroMuestras" step="1" /></div>}<footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()||refsLoading()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
