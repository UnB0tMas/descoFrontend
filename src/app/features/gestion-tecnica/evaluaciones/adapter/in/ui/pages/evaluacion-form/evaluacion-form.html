<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()" aria-labelledby="gt-evaluacion-form-evaluacion-form-dialog-title-1"><div class="modal-box admin-modal-box"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:pageIcon"/></span><div><p>Evaluaciones</p><h2 id="gt-evaluacion-form-evaluacion-form-dialog-title-1">{{current()?'Editar evaluación':'Registrar evaluación'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()" aria-label="Cerrar"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()">@if(!current()){<div class="admin-field admin-field-span-2"><label for="gt-evaluacion-form-evaluacion-form-field-1">Visita técnica</label><select class="admin-select" formControlName="visitaTecnicaId" [disabled]="refsLoading()" id="gt-evaluacion-form-evaluacion-form-field-1"><option [value]="0">Seleccionar</option>@for(v of visits();track v.value){<option [value]="v.value">{{v.label}}</option>}</select></div>}<div class="admin-field"><label for="gt-evaluacion-form-evaluacion-form-field-2">Tipo de evaluación</label><select class="admin-select" formControlName="tipoEvaluacionId" [disabled]="refsLoading()" id="gt-evaluacion-form-evaluacion-form-field-2"><option [value]="0">Seleccionar</option>@for(t of types();track t.value){<option [value]="t.value">{{t.label}}</option>}</select></div><div class="admin-field"><label for="gt-evaluacion-form-evaluacion-form-field-3">Cultivo</label><select class="admin-select" formControlName="parcelaCultivoId" id="gt-evaluacion-form-evaluacion-form-field-3"><option [value]="0">Sin cultivo específico</option>@for(c of crops();track c.value){<option [value]="c.value">{{c.label}}</option>}</select></div><div class="admin-field admin-field-span-2"><label for="gt-evaluacion-form-evaluacion-form-field-4">Fecha y hora</label><input type="datetime-local" class="admin-input" formControlName="fechaHora" [max]="maximumDateTime" id="gt-evaluacion-form-evaluacion-form-field-4" /></div><div class="admin-field admin-field-span-2"><label for="gt-evaluacion-form-evaluacion-form-field-5">Resultado</label><textarea class="admin-textarea" rows="4" formControlName="resultado" maxlength="600" id="gt-evaluacion-form-evaluacion-form-field-5"></textarea></div><div class="admin-field admin-field-span-2"><label for="gt-evaluacion-form-evaluacion-form-field-6">Observación</label><textarea class="admin-textarea" rows="3" formControlName="observacion" maxlength="400" id="gt-evaluacion-form-evaluacion-form-field-6"></textarea></div><label class="admin-switch-row admin-field-span-2"><div><strong>Registrar materia seca</strong><span>Incluye el porcentaje y número de muestras en esta evaluación.</span></div><input type="checkbox" class="admin-switch-control" formControlName="registrarMateriaSeca"/></label>@if(form.controls.registrarMateriaSeca.value){<div class="admin-field"><label for="gt-evaluacion-form-evaluacion-form-field-7">Materia seca (%)</label><input type="number" min="0" max="100" class="admin-input" formControlName="porcentajeMateriaSeca" step="0.01" id="gt-evaluacion-form-evaluacion-form-field-7" /></div><div class="admin-field"><label for="gt-evaluacion-form-evaluacion-form-field-8">Número de muestras</label><input type="number" min="1" class="admin-input" formControlName="numeroMuestras" step="1" id="gt-evaluacion-form-evaluacion-form-field-8" /></div>}<footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()||refsLoading()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando...}@else{<fa-icon [icon]="saveIcon"/> Guardar}</button></footer></form></div></dialog>
