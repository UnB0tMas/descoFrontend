<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault(); close()" aria-labelledby="gt-parcela-form-parcela-form-dialog-title-1">
  <div class="modal-box admin-modal-box desco-fixed-form-modal">
    <header class="admin-modal-header">
      <div class="admin-modal-title-group">
        <span class="admin-modal-icon">
          <fa-icon [icon]="current() ? editIcon : pageIcon" />
        </span>
        <div>
          <p>Parcelas</p>
          <h2 id="gt-parcela-form-parcela-form-dialog-title-1">{{ current() ? 'Editar parcela' : 'Registrar parcela' }}</h2>
        </div>
      </div>
      <button
        class="admin-icon-button"
        type="button"
        [disabled]="saving()"
        (click)="close()"
       aria-label="Cerrar">
        <fa-icon [icon]="closeIcon" />
      </button>
    </header>

    @if (error()) {
      <div class="admin-inline-error">{{ error() }}</div>
    }

    <form class="desco-fixed-form-layout" [formGroup]="form" (ngSubmit)="save()">
      <div class="desco-fixed-form-body admin-form-grid">
      <div class="admin-field admin-field-span-2">
        <label for="gt-parcela-form-parcela-form-field-1">Predio</label>
        <select class="admin-select" formControlName="predioId" id="gt-parcela-form-parcela-form-field-1">
          @for (property of options(); track property.id) {
            <option [value]="property.id">
              {{ property.codigo }} · {{ property.label }}
            </option>
          }
        </select>
        <app-form-error
          [control]="form.controls.predioId"
          fieldLabel="El predio"
        />
      </div>

      <div class="admin-field admin-field-span-2">
        <label for="gt-parcela-form-parcela-form-field-2">Nombre</label>
        <input
          class="admin-input"
          formControlName="nombre"
          maxlength="120"
        id="gt-parcela-form-parcela-form-field-2" />
        <app-form-error
          [control]="form.controls.nombre"
          fieldLabel="El nombre"
        />
        @if (current(); as plot) {
          <small>Código asignado: {{ plot.codigo }}</small>
        } @else {
          <small>El código de la parcela se generará automáticamente al registrar.</small>
        }
      </div>

      <div class="admin-field admin-field-span-2">
        <label for="gt-parcela-form-parcela-form-field-3">Área (ha)</label>
        <input
          type="number"
          class="admin-input"
          formControlName="areaHa"
          min="0.0001"
          max="999999.9999"
          step="0.0001"
        id="gt-parcela-form-parcela-form-field-3" />
        <app-form-error
          [control]="form.controls.areaHa"
          fieldLabel="El área"
        />
      </div>

      </div>
      <footer class="admin-modal-actions desco-fixed-form-footer">
        <button
          type="button"
          class="admin-secondary-button"
          [disabled]="saving()"
          (click)="close()"
        >
          Cancelar
        </button>
        <button
          class="admin-primary-button"
          type="submit"
          [disabled]="saving()"
        >
          @if (saving()) {
            <span class="loading loading-spinner loading-sm"></span>
            Guardando...
          } @else {
            <fa-icon [icon]="saveIcon" />
            Guardar
          }
        </button>
      </footer>
    </form>
  </div>
</dialog>
