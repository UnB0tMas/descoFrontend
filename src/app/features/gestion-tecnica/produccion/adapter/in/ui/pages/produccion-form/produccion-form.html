<dialog #dialog class="modal desco-modal" (cancel)="$event.preventDefault();close()" aria-labelledby="gt-produccion-form-produccion-form-dialog-title-1"><div class="modal-box admin-modal-box"><header class="admin-modal-header"><div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="current()?editIcon:pageIcon"/></span><div><p>Producción disponible</p><h2 id="gt-produccion-form-produccion-form-dialog-title-1">{{current()?'Editar estimación':'Registrar estimación'}}</h2></div></div><button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()" aria-label="Cerrar"><fa-icon [icon]="closeIcon"/></button></header>@if(errorMessage()){<div class="admin-inline-error">{{errorMessage()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="save()"><div class="admin-field admin-field-span-2"><label for="gt-produccion-form-produccion-form-field-1">Cultivo</label><select class="admin-select" formControlName="parcelaCultivoId" [disabled]="current()!==null||referencesLoading()||saving()" id="gt-produccion-form-produccion-form-field-1"><option [value]="0">{{referencesLoading()?'Cargando cultivos...':'Seleccionar cultivo'}}</option>@for(x of crops();track x.value){<option [value]="x.value">{{x.label}}</option>}</select><app-form-error [control]="form.controls.parcelaCultivoId" fieldLabel="El cultivo"/></div><div class="admin-field admin-field-span-2"><label for="gt-produccion-form-produccion-form-field-2">Visita técnica</label><select class="admin-select" formControlName="visitaTecnicaId" [disabled]="current()!==null||referencesLoading()||saving()" id="gt-produccion-form-produccion-form-field-2"><option [value]="0">{{referencesLoading()?'Cargando visitas...':'Seleccionar visita'}}</option>@for(x of visits();track x.value){<option [value]="x.value">{{x.label}}</option>}</select><app-form-error [control]="form.controls.visitaTecnicaId" fieldLabel="La visita"/></div><div class="admin-field"><label for="gt-produccion-form-produccion-form-field-3">Fecha de estimación</label><input type="date" class="admin-input" formControlName="fechaEstimacion" [max]="maximumDateTime" id="gt-produccion-form-produccion-form-field-3" /></div><div class="admin-field"><label for="gt-produccion-form-produccion-form-field-4">Cantidad estimada (kg)</label><input type="number" class="admin-input" formControlName="cantidadEstimadaKg" min="0.001"  max="99999999999.999"  step="0.001" id="gt-produccion-form-produccion-form-field-4" /></div><div class="admin-field"><label for="gt-produccion-form-produccion-form-field-5">Disponible desde</label><input type="date" class="admin-input" formControlName="disponibleDesde" [min]="form.controls.fechaEstimacion.value.slice(0, 10)" [max]="form.controls.disponibleHasta.value || undefined" id="gt-produccion-form-produccion-form-field-5" /></div><div class="admin-field"><label for="gt-produccion-form-produccion-form-field-6">Disponible hasta</label><input type="date" class="admin-input" formControlName="disponibleHasta" [min]="form.controls.disponibleDesde.value" id="gt-produccion-form-produccion-form-field-6" /></div><div class="admin-field admin-field-span-2"><label for="gt-produccion-form-produccion-form-field-7">Observación</label><textarea rows="3" class="admin-textarea" formControlName="observacion" maxlength="400" id="gt-produccion-form-produccion-form-field-7"></textarea></div><footer class="admin-modal-actions admin-field-span-2"><button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button><button type="submit" class="admin-primary-button" [disabled]="saving()||referencesLoading()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> {{current()?'Guardando...':'Registrando...'}}}@else{<fa-icon [icon]="saveIcon"/> {{current()?'Guardar cambios':'Registrar estimación'}}}</button></footer></form></div></dialog>
