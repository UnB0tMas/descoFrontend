<dialog #dialog class="modal desco-modal gp-modal" (cancel)="$event.preventDefault(); close()" aria-labelledby="gt-gestion-productiva-gp-parcela-form-dialog-title-1">
  <div class="modal-box admin-modal-box gp-dialog-box">
    <div class="admin-modal-header">
      <div class="admin-modal-title-group"><span class="admin-modal-icon"><fa-icon [icon]="modalIcon" /></span><div>
        <p>GESTIÓN PRODUCTIVA</p>
        <h2 id="gt-gestion-productiva-gp-parcela-form-dialog-title-1">{{ editing() ? 'Editar parcela' : 'Nueva parcela' }}</h2>
      </div></div>
      <button type="button" class="admin-icon-button" [disabled]="saving()" (click)="close()" aria-label="Cerrar"><fa-icon [icon]="closeIcon" /></button>
    </div>
    @if (error()) { <p class="gp-inline-error" role="alert">{{ error() }}</p> }
    @if (opened()) {
      <div class="gp-modal-section">
        <p class="gp-subtle">{{ productorId !== null ? 'Productor' : 'Predio' }}: {{ predioNombre }}</p>
        <div class="gp-form-grid">
          <label class="admin-field">Nombre de parcela
            <input class="admin-input" [(ngModel)]="nombre" maxlength="120" autocomplete="off" />
          </label>
          <label class="admin-field">Superficie (m²)
            <input class="admin-input" type="number" min="1" max="9999999999" step="1" [(ngModel)]="areaM2" />
          </label>
        </div>
        <label class="admin-field">Dirección o referencia (opcional)
          <input class="admin-input" [(ngModel)]="referencia" maxlength="300" autocomplete="off" />
        </label>
        <h3>Ubicación administrativa</h3>
        <div class="gp-form-geography">
          <app-geography-cascade [districtCode]="distrito" [populationCenterId]="centroPoblado"
            [disabled]="saving()" (selectionChange)="geography($event)" />
        </div>
        <div class="gp-map-heading"><strong>Ubicación GPS (opcional)</strong></div>
        <app-predio-map [editable]="!saving()" [autoLocateOnCreate]="!editing()"
          [latitude]="latitud" [longitude]="longitud" [height]="'19rem'"
          (locationChange)="point($event)" />
        @if (latitud !== null && longitud !== null) {
          <button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="clearPoint()">Quitar ubicación GPS</button>
        }
      </div>
    }
    <footer class="gp-modal-footer">
      <button type="button" class="admin-secondary-button" [disabled]="saving()" (click)="close()">Cancelar</button>
      <button type="button" class="admin-primary-button" [disabled]="saving() || !nombre.trim() || !distrito || areaM2 == null || areaM2 <= 0" (click)="save()">
        {{ saving() ? 'Guardando…' : 'Guardar parcela' }}
      </button>
    </footer>
  </div>
</dialog>
