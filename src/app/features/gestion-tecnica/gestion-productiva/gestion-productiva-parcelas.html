<div class="desco-page gp-page">
  <app-breadcrumb variant="compact" [showHome]="false"
    [segments]="[{label:'Productores',url:'/gestion-tecnica/gestion-productiva'},
                 {label:predioNombre(),url:''}]" />
  <app-page-header [title]="predioNombre()" eyebrow="Gestión productiva · Parcelas"
    subtitle="Selecciona una parcela para consultar sus actividades, censos, sanidad y evaluaciones."
    [icon]="pageIcon">
    <div pageActions class="flex flex-wrap gap-2">
      <a routerLink="/gestion-tecnica/gestion-productiva" class="admin-secondary-button"><fa-icon [icon]="backIcon" /> Productores</a>
      <button type="button" class="admin-secondary-button" [disabled]="loading()" (click)="load()"><fa-icon [icon]="refreshIcon" /> Actualizar</button>
      <button *appPermission="'CULTIVOS_CREAR'" type="button" class="admin-primary-button" (click)="create()"><fa-icon [icon]="addIcon" /> Nueva parcela</button>
    </div>
  </app-page-header>
  <section class="admin-surface mt-5" aria-label="Listado de parcelas">
    <div class="admin-toolbar gp-filter-toolbar">
      <div class="admin-field gp-search">
        <label for="gpBuscarParcela">Nombre o código</label>
        <input id="gpBuscarParcela" class="admin-input" type="search" [ngModel]="search()" (ngModelChange)="onSearch($event)" placeholder="Buscar en este predio" autocomplete="off" />
      </div>
      <app-list-view-switch class="gp-shared-view-switch" appearance="segmented" label="Presentación de parcelas" [view]="view()==='tabla'?'table':'cards'" (viewChange)="view.set($event==='table'?'tabla':'tarjetas')" />
    </div>
    @if (loading()) { <app-loading-state title="Cargando parcelas" message="Consultando parcelas del predio seleccionado." /> }
    @else if (error()) { <app-error-state [message]="error() || 'No se pudo cargar el listado.'" (retry)="load()" /> }
    @else if (filtered().length === 0) {
      <app-empty-state [title]="search() ? 'Sin coincidencias' : 'Sin parcelas registradas'"
        [message]="search() ? 'Prueba con otro nombre o código.' : 'Registra una parcela para iniciar el seguimiento productivo.'"
        [actionLabel]="search() ? 'Limpiar búsqueda' : null" (action)="clear()" />
    } @else {
      @if (view() === 'tabla') {
        <ng-template #parcelaCell let-p><div class="admin-stack-copy"><strong>{{p.nombre}}</strong><span>{{p.codigo}}</span></div></ng-template>
        <ng-template #estadoCell let-p><span class="admin-status" [class.admin-status--active]="p.estado" [class.admin-status--inactive]="!p.estado">{{p.estado ? 'Activa' : 'Inactiva'}}</span></ng-template>
        <ng-template #accionesCell let-p><div class="admin-row-actions gp-activity-actions">
          <a *appPermission="'CULTIVOS_VER'" class="admin-icon-button" [routerLink]="['/gestion-tecnica/gestion-productiva/predios',predioId,'parcelas',p.parcelaId]" [attr.aria-label]="'Seguimiento de ' + p.nombre" title="Detalles de parcela"><fa-icon [icon]="viewIcon" /></a>
          <button *appPermission="'CULTIVOS_EDITAR'" type="button" class="admin-icon-button" [attr.aria-label]="'Editar ' + p.nombre" title="Editar parcela" [disabled]="!actuacionPermitida() || editing() || !p.estado" (click)="edit(p)"><fa-icon [icon]="editIcon" /></button>
          <button *appPermission="'CULTIVOS_RETIRAR'" type="button" class="admin-icon-button admin-icon-button--danger" [disabled]="!actuacionPermitida() || editing()||!p.estado" (click)="eliminar(p)" title="Eliminar parcela" [attr.aria-label]="'Eliminar '+p.nombre"><fa-icon [icon]="deleteIcon" /></button>
        </div></ng-template>
        <app-data-table appearance="admin" [columns]="columns" [rows]="visible()" trackByKey="parcelaId"
          [cellTemplates]="{nombre: parcelaCell, estado: estadoCell, acciones: accionesCell}" />
      } @else {
        <div class="desco-record-grid--adaptive gp-fixed-card-grid" aria-label="Tarjetas de parcelas">
          @for (p of visible(); track p.parcelaId) {
            <app-institutional-record-card layout="summary" actionsLayout="icons"
              [icon]="pageIcon" [code]="p.codigo" [heading]="p.nombre"
              [metadata]="[p.areaHa == null ? 'Área por completar' : (p.areaHa | number:'1.2-2') + ' ha']">
              <span recordStatus class="admin-status" [class.admin-status--active]="p.estado"
                [class.admin-status--inactive]="!p.estado">{{p.estado ? 'Activa' : 'Inactiva'}}</span>
              <div recordActions class="gp-activity-actions gp-card-icon-actions">
                <a *appPermission="'CULTIVOS_VER'" class="admin-icon-button"
                  [routerLink]="['/gestion-tecnica/gestion-productiva/predios',predioId,'parcelas',p.parcelaId]"
                  title="Detalles de parcela" [attr.aria-label]="'Ver detalles de '+p.nombre">
                  <fa-icon [icon]="viewIcon" />
                </a>
                <button *appPermission="'CULTIVOS_EDITAR'" type="button" class="admin-icon-button"
                  [disabled]="!actuacionPermitida() || editing() || !p.estado" (click)="edit(p)" title="Editar parcela"
                  [attr.aria-label]="'Editar '+p.nombre"><fa-icon [icon]="editIcon" /></button>
                <button *appPermission="'CULTIVOS_RETIRAR'" type="button"
                  class="admin-icon-button admin-icon-button--danger" [disabled]="!actuacionPermitida() || editing() || !p.estado"
                  (click)="eliminar(p)" title="Eliminar parcela"
                  [attr.aria-label]="'Eliminar '+p.nombre"><fa-icon [icon]="deleteIcon" /></button>
              </div>
            </app-institutional-record-card>
          }
        </div>
      }
      <app-paginator [page]="page()" [size]="size()" [totalRecords]="filtered().length" [totalPages]="totalPages()"
        (pageChange)="setPage($event)" (sizeChange)="setSize($event)" />
    }
  </section>
  <app-gp-parcela-form />
  <app-action-confirm-dialog />
</div>
