<dialog #dialog class="modal desco-modal gp-modal apappss-dialog" aria-labelledby="apappssPredioTitle"
 (cancel)="$event.preventDefault();close()">
 <div class="modal-box admin-modal-box admin-modal-box--wide gp-dialog-box apappss-dialog-box">
  <header class="admin-modal-header"><div class="admin-modal-title-group">
   <span class="admin-modal-icon"><fa-icon [icon]="icon"/></span><div><p>Convenios · APAPPSS</p>
    <h2 id="apappssPredioTitle">{{esEdicion?'Editar predio':'Registrar predio'}}</h2></div></div>
   <button type="button" class="admin-icon-button" aria-label="Cerrar" [disabled]="guardando()" (click)="close()"><fa-icon [icon]="closeIcon"/></button>
  </header>
  <div class="gp-modal-section apappss-alta-content">
   @if(loading()){<p class="gp-inline-note">Cargando predio…</p>}
   @if(error()){<div class="admin-inline-error" role="alert">{{error()}}</div>}
   @if(socio();as s){
    <div class="apappss-socio-summary"><span>Socio</span><strong>{{s.nombres}} {{s.apellidoPaterno}} {{s.apellidoMaterno||''}}</strong></div>
    <form id="apappss-predio-form" class="apappss-alta-form" (ngSubmit)="guardar()">
     <div class="apappss-alta-grid">
      <label class="admin-field"><span>Nombre del predio</span>
       <input class="admin-input" name="nombre" [(ngModel)]="nombre" maxlength="150" required/></label>
      <label class="admin-field"><span>Superficie total (ha)</span>
       <input class="admin-input" name="superficie" type="number" min="0.0001" max="999999.9999" step="0.0001" [(ngModel)]="superficieHa" required/></label>
      <label class="admin-field"><span>Área cultivable (ha) · opcional</span>
       <input class="admin-input" name="cultivable" type="number" min="0" step="0.0001" [(ngModel)]="areaCultivableHa"/></label>
      <label class="admin-field"><span>Tipo de riego · opcional</span>
       <input class="admin-input" name="riego" maxlength="30" [(ngModel)]="tipoRiego"/></label>
     </div>
     <div class="apappss-alta-heading"><h3>Ubicación</h3></div>
     <app-geography-cascade [districtCode]="distrito" [populationCenterId]="centroPobladoId" (selectionChange)="ubicacion($event)"/>
     <label class="admin-field apappss-full-width"><span>Referencia · opcional</span>
      <input class="admin-input" name="referencia" [(ngModel)]="referencia" maxlength="300"/></label>
     <div class="apappss-alta-heading"><h3>Ubicación en el mapa</h3></div>
     <div class="apappss-map-wrapper"><app-predio-map [latitude]="latitud" [longitude]="longitud"
      [editable]="true" [autoLocateOnCreate]="!esEdicion" height="18rem" (locationChange)="punto($event)"/></div>
    </form>
   }
  </div>
  <footer class="gp-modal-footer admin-modal-actions apappss-alta-footer">
   <button type="button" class="admin-secondary-button" [disabled]="guardando()" (click)="close()">Cancelar</button>
   <button type="submit" form="apappss-predio-form" class="admin-primary-button"
    [disabled]="loading()||guardando()||!formularioValido()">{{guardando()?'Guardando…':esEdicion?'Guardar cambios':'Registrar predio'}}</button>
  </footer>
 </div>
</dialog>
