<div class="desco-page"><app-page-header title="Saldo del comprador" [icon]="pageIcon"><a class="admin-secondary-button" routerLink="/finanzas/cobros"><fa-icon [icon]="backIcon"/> Volver</a><button class="admin-secondary-button" type="button" [disabled]="loading()" (click)="load()">@if(loading()){<span class="loading loading-spinner loading-xs"></span>}@else{<fa-icon [icon]="refreshIcon"/>} Actualizar</button></app-page-header>@if(loading()){<app-loading-state title="Cargando saldo" message="Consultando información."/>}@else if(error()){<app-error-state [message]="error()||'No se pudo completar la consulta.'" (retry)="load()"/>}@else if(saldo();as s){<section class="admin-surface"><div class="admin-detail-header"><div><span class="admin-type-badge">Campaña</span><h2>Resumen de cobros</h2><p>Importes consolidados.</p></div></div><div class="admin-detail-grid"><div><span>Total valorizado</span><strong>{{s.totalValorizado|number:'1.2-2'}}</strong></div><div><span>Total cobrado</span><strong>{{s.totalCobrado|number:'1.2-2'}}</strong></div><div><span>Saldo pendiente</span><strong>{{s.saldoPendiente|number:'1.2-2'}}</strong></div></div></section>}</div>
