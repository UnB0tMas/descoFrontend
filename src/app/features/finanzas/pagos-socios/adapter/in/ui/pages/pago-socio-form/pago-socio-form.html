<dialog #dialog class="modal"><div class="modal-box max-w-2xl bg-white"><header class="admin-modal-header"><div class="admin-modal-heading"><span class="admin-modal-icon"><fa-icon [icon]="pageIcon"/></span><div><h3>Registrar pago</h3><p>Completa los datos del pago.</p></div></div><button class="admin-icon-button" type="button" [disabled]="saving()" (click)="close()"><fa-icon [icon]="closeIcon"/></button></header>@if(error()){<div class="admin-inline-error" role="alert">{{error()}}</div>}<form class="admin-form-grid" [formGroup]="form" (ngSubmit)="submit()"><div class="admin-field"><label>Liquidación</label><input class="admin-input" type="number" min="1" formControlName="liquidacionSocioId"/><app-form-error [control]="form.controls.liquidacionSocioId" fieldLabel="La liquidación"/></div><div class="admin-field"><label>Importe</label><input class="admin-input" type="number" min=".01" step=".01" formControlName="importe"/><app-form-error [control]="form.controls.importe" fieldLabel="El importe"/></div><div class="admin-field"><label>Medio de pago</label><input class="admin-input" maxlength="60" formControlName="medioPago"/><app-form-error [control]="form.controls.medioPago" fieldLabel="El medio de pago"/></div><div class="admin-field"><label>Número de operación</label><input class="admin-input" maxlength="120" formControlName="numeroOperacion"/></div><footer class="admin-modal-actions admin-field-span-2"><button class="admin-secondary-button" type="button" [disabled]="saving()" (click)="close()">Cancelar</button><button class="admin-primary-button" type="submit" [disabled]="saving()">@if(saving()){<span class="loading loading-spinner loading-sm"></span> Guardando…}@else{<fa-icon [icon]="saveIcon"/> Registrar}</button></footer></form></div></dialog>
