<div class="desco-page"><app-page-header title="Reportes e indicadores" subtitle="Información disponible según tu acceso" [icon]="pageIcon"><button class="admin-secondary-button" type="button" [disabled]="loading()" (click)="load()">@if(loading()){<span class="loading loading-spinner loading-xs"></span>}@else{<fa-icon [icon]="refreshIcon"/>} Actualizar</button></app-page-header><section class="admin-surface">@if(loading()){<app-loading-state title="Cargando reportes" message="Consultando información."/>}@else if(error()){<app-error-state [message]="error()||'No se pudo completar la consulta.'" (retry)="load()"/>}@else if(items().length===0){<app-empty-state title="Sin reportes" message="No hay reportes disponibles."/>}@else{<div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Reporte</th><th>Grupo</th><th>Descripción</th><th class="text-right">Acciones</th></tr></thead><tbody>@for(x of items();track x.codigo){<tr><td><strong>{{x.nombre}}</strong></td><td>{{x.grupo||'—'}}</td><td>{{x.descripcion||'—'}}</td><td><a *appPermission="'REPORTES_VER'" class="admin-icon-button" [routerLink]="['/reportes',x.codigo]" title="Ver reporte"><fa-icon [icon]="viewIcon"/></a></td></tr>}</tbody></table></div>}</section></div>
