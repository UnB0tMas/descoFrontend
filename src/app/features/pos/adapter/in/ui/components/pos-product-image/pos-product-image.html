<div class="pos-product-image">
  @if (src() && !failed()) {
    <img
      [src]="src()"
      [alt]="alt"
      loading="lazy"
      (error)="onError()"
    />
  } @else {
    <div class="pos-product-image__placeholder">
      @if (loading()) {
        <span class="loading loading-spinner loading-sm"></span>
      } @else {
        <svg class="pos-product-image__art" viewBox="0 0 96 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
          <rect x="9" y="9" width="78" height="54" rx="7" stroke="currentColor" stroke-width="2" />
          <circle cx="30" cy="26" r="6" stroke="currentColor" stroke-width="2" />
          <path d="M15 55 36 35l13 12 12-13 20 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
    </div>
  }
</div>
