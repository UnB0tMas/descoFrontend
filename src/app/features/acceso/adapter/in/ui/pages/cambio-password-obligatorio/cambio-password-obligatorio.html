<app-auth-layout>
  <section class="auth-step-card">
    <div class="auth-step-icon">
      <fa-icon [icon]="keyIcon" />
    </div>

    <header>
      <h2>Actualiza tu contraseña</h2>
      <p>Define una nueva contraseña para continuar.</p>
    </header>

    @if (errorMessage()) {
      <div class="auth-inline-error" role="alert">{{ errorMessage() }}</div>
    }

    <form class="mt-6 space-y-4" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label class="auth-label" for="passwordActualObligatorio">
          Contraseña actual
        </label>
        <div class="auth-input-wrap">
          <fa-icon class="auth-input-icon" [icon]="lockIcon" />
          <input
            id="passwordActualObligatorio"
            class="auth-control"
            type="password"
            formControlName="passwordActual"
            autocomplete="current-password"
          />
        </div>
        <app-form-error
          [control]="form.controls.passwordActual"
          fieldLabel="La contraseña actual"
        />
      </div>

      <div>
        <label class="auth-label" for="nuevoPasswordObligatorio">
          Nueva contraseña
        </label>
        <div class="auth-input-wrap">
          <fa-icon class="auth-input-icon" [icon]="keyIcon" />
          <input
            id="nuevoPasswordObligatorio"
            class="auth-control"
            type="password"
            formControlName="nuevoPassword"
            autocomplete="new-password"
            placeholder="Mínimo 12 caracteres"
          />
        </div>
        <app-form-error
          [control]="form.controls.nuevoPassword"
          fieldLabel="La nueva contraseña"
        />
      </div>

      <div>
        <label class="auth-label" for="confirmarPasswordObligatorio">
          Confirmar contraseña
        </label>
        <div class="auth-input-wrap">
          <fa-icon class="auth-input-icon" [icon]="checkIcon" />
          <input
            id="confirmarPasswordObligatorio"
            class="auth-control"
            type="password"
            formControlName="confirmarPassword"
            autocomplete="new-password"
          />
        </div>
        <app-form-error
          [control]="form.controls.confirmarPassword"
          fieldLabel="La confirmación"
        />
      </div>

      <button
        type="submit"
        class="auth-primary-button"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="loading loading-spinner loading-sm"></span>
          Actualizando...
        } @else {
          <fa-icon [icon]="checkIcon" />
          Guardar y continuar
        }
      </button>
    </form>
  </section>
</app-auth-layout>
