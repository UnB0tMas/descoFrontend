<app-auth-layout>
  <section class="auth-step-card">
    <div class="auth-step-icon">
      <fa-icon [icon]="keyIcon" />
    </div>

    <header>
      <h2>Recuperar acceso</h2>
      <p>Ingresa tu usuario y te enviaremos las instrucciones al correo registrado.</p>
    </header>

    @if (errorMessage()) {
      <div class="auth-inline-error" role="alert">{{ errorMessage() }}</div>
    }

    <form class="mt-6" [formGroup]="form" (ngSubmit)="submit()">
      <label class="auth-label" for="usuarioRecuperacion">Usuario</label>

      <div class="auth-input-wrap">
        <fa-icon class="auth-input-icon" [icon]="userIcon" />
        <input
          id="usuarioRecuperacion"
          class="auth-control"
          type="text"
          formControlName="nombreUsuario"
          autocomplete="username"
          placeholder="Nombre de usuario"
        />
      </div>

      <app-form-error
        [control]="form.controls.nombreUsuario"
        fieldLabel="El usuario"
      />

      <button
        class="auth-primary-button mt-5"
        type="submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="loading loading-spinner loading-sm"></span>
          Enviando...
        } @else {
          <fa-icon [icon]="mailIcon" />
          Enviar instrucciones
        }
      </button>
    </form>

    <a routerLink="/login" class="auth-back-link">
      <fa-icon [icon]="backIcon" />
      Volver al inicio de sesión
    </a>
  </section>
</app-auth-layout>
