<main class="min-h-screen bg-base-200 p-6">
  <section class="mx-auto flex min-h-[70vh] max-w-xl items-center justify-center">
    <div class="card w-full border border-base-300 bg-base-100 shadow-sm">
      <div class="card-body items-center text-center">
        <div class="text-5xl font-bold text-error">503</div>
        <h1 class="card-title text-2xl">{{ title }}</h1>
        <p class="text-base-content/70">{{ message }}</p>
        <div class="card-actions mt-4">
          <a class="btn btn-primary" routerLink="/">Volver al inicio</a>
        </div>
      </div>
    </div>
  </section>
</main>
