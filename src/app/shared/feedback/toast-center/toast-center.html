<div
  class="pointer-events-none fixed right-4 top-4 z-[120] flex w-[min(25rem,calc(100vw-2rem))] flex-col gap-3"
  aria-live="polite"
  aria-atomic="false"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <article
      class="pointer-events-auto flex items-start gap-3 rounded-2xl border bg-white p-4 shadow-xl shadow-slate-950/5"
      [class]="borderClass(toast)"
      role="status"
    >
      <div
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl"
        [class]="iconClass(toast)"
      >
        <fa-icon [icon]="iconFor(toast)" />
      </div>

      <div class="min-w-0 flex-1">
        <h3 class="text-sm font-semibold text-slate-950">
          {{ toast.title }}
        </h3>

        @if (toast.message) {
          <p class="mt-1 text-sm leading-5 text-slate-600">
            {{ toast.message }}
          </p>
        }
      </div>

      @if (toast.dismissible) {
        <button
          type="button"
          class="btn btn-ghost btn-sm btn-square shrink-0 rounded-xl text-slate-500 hover:bg-slate-100"
          aria-label="Cerrar notificación"
          (click)="toastService.dismiss(toast.id)"
        >
          <fa-icon [icon]="closeIcon" />
        </button>
      }
    </article>
  }
</div>
