<section class="desco-section-panel" [class.desco-section-panel--flush]="!padded">
  @if (title || description) {
    <header class="desco-section-panel__header">
      <div class="desco-section-panel__heading">
        @if (icon) { <span class="desco-section-panel__icon"><fa-icon [icon]="icon" /></span> }
        <div>
          @if (title) { <h2>{{ title }}</h2> }
          @if (description) { <p>{{ description }}</p> }
        </div>
      </div>
      <div class="desco-section-panel__actions"><ng-content select="[panelActions]" /></div>
    </header>
  }
  <div class="desco-section-panel__body"><ng-content /></div>
</section>
