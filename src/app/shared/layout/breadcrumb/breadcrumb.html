<nav class="flex min-w-0 items-center gap-2 text-sm text-slate-500" aria-label="Breadcrumb">
  <a
    routerLink="/"
    class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-500 transition hover:bg-blue-50 hover:text-blue-700"
    aria-label="Inicio"
  >
    <fa-icon [icon]="homeIcon" />
  </a>

  @for (item of items(); track item.url; let last = $last) {
    <fa-icon class="shrink-0 text-[10px] text-slate-300" [icon]="separatorIcon" />

    @if (last) {
      <span class="truncate font-medium text-slate-700" aria-current="page">
        {{ item.label }}
      </span>
    } @else {
      <a
        [routerLink]="item.url"
        class="truncate transition hover:text-blue-700"
      >
        {{ item.label }}
      </a>
    }
  }
</nav>
