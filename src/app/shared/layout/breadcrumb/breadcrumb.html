<nav class="desco-breadcrumb flex min-w-0 items-center gap-2 text-sm text-slate-500"
     [class.desco-breadcrumb--compact]="variant()==='compact'"
     aria-label="Ruta de navegación">
  @if (showHome()) {
    <a routerLink="/" class="desco-breadcrumb__home flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-500 transition hover:bg-blue-50 hover:text-blue-700" aria-label="Inicio">
      <fa-icon [icon]="homeIcon" />
    </a>
  }
  @for (item of (segments() ?? items()); track $index; let last = $last; let first = $first) {
    @if (showHome() || !first) {
      @if (variant()==='compact') {
        <span class="desco-breadcrumb__separator" aria-hidden="true">/</span>
      } @else {
        <fa-icon class="shrink-0 text-[10px] text-slate-300" [icon]="separatorIcon" aria-hidden="true" />
      }
    }
    @if (last || !item.url) {
      <span class="desco-breadcrumb__current truncate font-medium text-slate-700" aria-current="page">{{item.label}}</span>
    } @else {
      <a [routerLink]="item.url" [queryParams]="item.queryParams ?? null" class="desco-breadcrumb__link truncate transition hover:text-blue-700">{{item.label}}</a>
    }
  }
</nav>
