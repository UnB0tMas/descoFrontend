<header class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
  <div class="flex min-w-0 items-start gap-4">
    @if (showBack) {
      <button
        type="button"
        class="btn btn-ghost btn-square mt-0.5 shrink-0 rounded-xl border border-slate-200 bg-white text-slate-600 hover:bg-slate-50"
        aria-label="Volver"
        (click)="back.emit()"
      >
        <fa-icon [icon]="backIcon" />
      </button>
    }

    <div class="flex min-w-0 items-start gap-3">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-sm">
        <fa-icon [icon]="icon" />
      </div>

      <div class="min-w-0">
        @if (eyebrow) {
          <p class="text-xs font-semibold uppercase tracking-[0.16em] text-blue-600">
            {{ eyebrow }}
          </p>
        }

        <h1 class="break-words text-2xl font-bold tracking-tight text-slate-950 sm:text-3xl">
          {{ title }}
        </h1>

        @if (subtitle) {
          <p class="mt-1 max-w-3xl text-sm leading-6 text-slate-500">
            {{ subtitle }}
          </p>
        }
      </div>
    </div>
  </div>

  <div class="flex shrink-0 flex-wrap items-center gap-2">
    <ng-content select="[pageActions]" />
  </div>
</header>
