<section class="flex min-h-64 items-center justify-center rounded-2xl border border-red-200 bg-white p-8 text-center">
  <div class="max-w-md">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-red-50 text-xl text-red-600">
      <fa-icon [icon]="errorIcon" />
    </div>

    <h3 class="mt-5 text-base font-semibold text-slate-950">
      {{ title }}
    </h3>

    <p class="mx-auto mt-2 max-w-sm text-sm leading-6 text-slate-500">
      {{ message }}
    </p>

    @if (showRetry) {
      <button
        type="button"
        class="btn mt-5 rounded-xl border border-blue-200 bg-blue-50 text-blue-700 hover:bg-blue-100"
        (click)="retry.emit()"
      >
        <fa-icon [icon]="retryIcon" />
        {{ retryLabel }}
      </button>
    }
  </div>
</section>
