@if (loadingService.state().visible) {
  <div
    class="fixed inset-0 z-[140] flex items-center justify-center bg-slate-950/35 p-4 backdrop-blur-[2px]"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <section class="w-full max-w-sm rounded-3xl border border-slate-200 bg-white/95 p-7 text-center shadow-2xl shadow-slate-950/20 dark:border-slate-700 dark:bg-slate-900/95">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-50 text-blue-600 dark:bg-blue-950/60 dark:text-blue-300">
        <fa-icon class="text-2xl animate-spin" [icon]="spinnerIcon" />
      </div>

      <h2 class="mt-5 text-lg font-bold text-slate-950 dark:text-slate-100">
        {{ loadingService.state().title }}
      </h2>

      @if (loadingService.state().message) {
        <p class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300">
          {{ loadingService.state().message }}
        </p>
      }

      <div class="mt-6 flex items-center justify-center gap-2 text-xs font-medium text-blue-700 dark:text-blue-300">
        <fa-icon [icon]="shieldIcon" />
        <span>Sincronizando permisos y datos del contexto seleccionado.</span>
      </div>
    </section>
  </div>
}
