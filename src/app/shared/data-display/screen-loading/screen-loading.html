@if (loadingService.state().visible) {
  <div class="desco-screen-loading" role="status" aria-live="polite" aria-busy="true">
    <section class="desco-screen-loading__panel" aria-label="Operación en curso">
      <div class="desco-screen-loading__orb" aria-hidden="true">
        <span class="desco-screen-loading__ring"></span>
        <fa-icon [icon]="spinnerIcon" class="desco-screen-loading__symbol" />
      </div>
      <h2>{{ loadingService.state().title }}</h2>
      @if (loadingService.state().message) {
        <p>{{ loadingService.state().message }}</p>
      }
      <span class="desco-screen-loading__progress" aria-hidden="true"><span></span></span>
    </section>
  </div>
}
