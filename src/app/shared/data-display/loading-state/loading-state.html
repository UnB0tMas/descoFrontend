<section
  class="desco-loading-skeleton"
  [class.desco-loading-skeleton--compact]="compact"
  [attr.aria-label]="title"
  aria-busy="true"
  role="status"
>
  <span class="sr-only">{{ title }}</span>

  @if (variant === 'cards') {
    <div class="desco-skeleton-card-grid">
      @for (item of items; track item) {
        <article class="desco-skeleton-card" aria-hidden="true">
          <span class="desco-skeleton-line desco-skeleton-line--short"></span>
          <span class="desco-skeleton-line desco-skeleton-line--strong"></span>
          <span class="desco-skeleton-line"></span>
        </article>
      }
    </div>
  } @else if (variant === 'detail') {
    <div class="desco-skeleton-detail" aria-hidden="true">
      <span class="desco-skeleton-line desco-skeleton-line--title"></span>
      @for (item of items; track item) {
        <div class="desco-skeleton-detail-row">
          <span class="desco-skeleton-line desco-skeleton-line--short"></span>
          <span class="desco-skeleton-line"></span>
        </div>
      }
    </div>
  } @else {
    <div class="desco-skeleton-table" aria-hidden="true">
      <div class="desco-skeleton-table-head">
        <span class="desco-skeleton-line desco-skeleton-line--short"></span>
        <span class="desco-skeleton-line"></span>
        <span class="desco-skeleton-line desco-skeleton-line--short"></span>
      </div>
      @for (item of items; track item) {
        <div class="desco-skeleton-table-row">
          <span class="desco-skeleton-dot"></span>
          <span class="desco-skeleton-line"></span>
          <span class="desco-skeleton-line desco-skeleton-line--short"></span>
          <span class="desco-skeleton-line desco-skeleton-line--short"></span>
        </div>
      }
    </div>
  }
</section>
