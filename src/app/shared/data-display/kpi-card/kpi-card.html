<article class="group h-full rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition duration-200 hover:border-blue-200 hover:shadow-lg hover:shadow-blue-950/5">
  <div class="flex items-start justify-between gap-4">
    <div class="min-w-0">
      <p class="text-sm font-medium text-slate-500">
        {{ data.label }}
      </p>

      <p class="mt-2 truncate text-3xl font-bold tracking-tight text-slate-950">
        {{ data.value }}
      </p>
    </div>

    <div
      class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl ring-1 ring-inset"
      [class]="toneClass(data.tone)"
    >
      <fa-icon [icon]="data.icon" />
    </div>
  </div>

  <div class="mt-4 flex items-end justify-between gap-3 border-t border-slate-100 pt-4">
    <div class="min-w-0">
      @if (data.trendLabel) {
        <p
          class="flex items-center gap-1.5 text-xs font-semibold"
          [class]="trendClass(data.trendDirection)"
        >
          <fa-icon [icon]="trendIcon(data.trendDirection)" />
          <span>{{ data.trendLabel }}</span>
        </p>
      }

      @if (data.description) {
        <p class="mt-1 text-xs leading-5 text-slate-500">
          {{ data.description }}
        </p>
      }
    </div>

    <span class="h-1.5 w-10 shrink-0 rounded-full bg-blue-600"></span>
  </div>
</article>
