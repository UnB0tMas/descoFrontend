<fieldset class="desco-radio-group" [disabled]="disabled">
  <legend>{{label}}</legend>
  <div class="desco-radio-options">
    @for (option of options; track option.value) {
      <label class="desco-radio-option" [class.desco-radio-option--selected]="value === option.value"
        [class.desco-radio-option--disabled]="disabled || option.disabled">
        <input type="radio" [name]="name" [value]="option.value" [checked]="value === option.value"
          [disabled]="disabled || !!option.disabled" (change)="select(option)" />
        <span>{{option.label}}</span>
      </label>
    }
  </div>
</fieldset>
