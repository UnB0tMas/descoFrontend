<dialog #dialog class="desco-modal person-registration-modal" aria-labelledby="persona-modal-titulo"
  (cancel)="$event.preventDefault(); close()">
  <div class="admin-modal-box person-registration-modal__box">
    <header class="admin-modal-header person-registration-modal__header">
      <div class="admin-modal-title-group">
        <div>
          <p class="person-registration-modal__eyebrow">Personas</p>
          <h2 id="persona-modal-titulo">{{pickerStage() === 'manual' ? 'Registrar persona' : 'Identificar persona'}}</h2>
        </div>
      </div>
      <button type="button" class="admin-icon-button" aria-label="Cerrar registro de persona"
        [disabled]="closing() || pickerSaving()" (click)="close()">
        <fa-icon [icon]="closeIcon" />
      </button>
    </header>
    <div class="person-registration-modal__body">
      <app-person-owner-picker idPrefix="persona-compartida" [actionsInFooter]="true"
        [findPerson]="findPerson" [savePerson]="savePerson" [disabled]="closing()"
        (personChosen)="choose($event)" />
    </div>
    <footer class="admin-modal-actions person-registration-modal__footer">
      <button type="button" class="admin-secondary-button" [disabled]="closing() || pickerSaving()"
        (click)="close()">Cancelar</button>
      @if (pickerStage() === 'manual') {
        <button type="button" class="admin-primary-button" [disabled]="closing() || pickerBusy()"
          (click)="save()">{{pickerBusy() ? 'Guardando…' : 'Guardar persona'}}</button>
      }
    </footer>
  </div>
</dialog>
