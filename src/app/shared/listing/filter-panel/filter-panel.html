<section class="desco-filter-panel">
  <header class="flex items-start justify-between gap-4 px-5 py-4">
    <div class="flex items-start gap-3">
      <div class="desco-filter-panel__icon">
        <fa-icon [icon]="filterIcon" />
      </div>

      <div>
        <h2 class="desco-filter-panel__title">
          {{ title }}
        </h2>
        <p class="desco-filter-panel__description">
          {{ description }}
        </p>
      </div>
    </div>

    @if (collapsible) {
      <button
        type="button"
        class="admin-icon-button"
        [attr.aria-expanded]="expanded()"
        aria-label="Mostrar u ocultar filtros"
        (click)="toggle()"
      >
        <fa-icon
          class="transition-transform duration-200"
          [class.rotate-180]="expanded()"
          [icon]="chevronIcon"
        />
      </button>
    }
  </header>

  @if (expanded()) {
    <div class="desco-filter-panel__body">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">
        <ng-content />
      </div>

      @if (showActions && (showApply || showClear)) {
      <div class="desco-filter-panel__actions">
        @if (showClear) { <button
          type="button"
          class="admin-secondary-button"
          [disabled]="applying"
          (click)="clear.emit()"
        >
          <fa-icon [icon]="clearIcon" />
          {{ clearLabel }}
        </button> }

        @if (showApply) { <button
          type="button"
          class="admin-primary-button"
          [disabled]="applying"
          (click)="apply.emit()"
        >
          @if (applying) {
            <fa-icon class="animate-spin" [icon]="spinnerIcon" />
            Aplicando...
          } @else {
            <fa-icon [icon]="searchIcon" />
            {{ applyLabel }}
          }
        </button> }
      </div>
      }
    </div>
  }
</section>
