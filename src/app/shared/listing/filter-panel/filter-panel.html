<section class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
  <header class="flex items-start justify-between gap-4 px-5 py-4">
    <div class="flex items-start gap-3">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-blue-50 text-blue-700">
        <fa-icon [icon]="filterIcon" />
      </div>

      <div>
        <h2 class="text-sm font-semibold text-slate-950">
          {{ title }}
        </h2>
        <p class="mt-1 text-xs leading-5 text-slate-500">
          {{ description }}
        </p>
      </div>
    </div>

    @if (collapsible) {
      <button
        type="button"
        class="btn btn-ghost btn-sm btn-square rounded-xl text-slate-500"
        [attr.aria-expanded]="expanded()"
        aria-label="Mostrar u ocultar filtros"
        (click)="toggle()"
      >
        <fa-icon
          class="transition-transform duration-200"
          [class.rotate-180]="expanded()"
          [icon]="chevronIcon"
        />
      </button>
    }
  </header>

  @if (expanded()) {
    <div class="border-t border-slate-100 px-5 py-5">
      <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4">
        <ng-content />
      </div>

      <div class="mt-5 flex flex-col-reverse gap-3 border-t border-slate-100 pt-4 sm:flex-row sm:justify-end">
        <button
          type="button"
          class="btn rounded-xl border border-slate-200 bg-white text-slate-700 hover:bg-slate-50"
          [disabled]="applying"
          (click)="clear.emit()"
        >
          <fa-icon [icon]="clearIcon" />
          Limpiar
        </button>

        <button
          type="button"
          class="btn rounded-xl border-0 bg-blue-600 text-white hover:bg-blue-700"
          [disabled]="applying"
          (click)="apply.emit()"
        >
          @if (applying) {
            <fa-icon class="animate-spin" [icon]="spinnerIcon" />
            Aplicando...
          } @else {
            <fa-icon [icon]="searchIcon" />
            Aplicar filtros
          }
        </button>
      </div>
    </div>
  }
</section>
